experiment:
  name: expA00_a_rare_only
  seed: 42
  results_root: results
data:
  folds_csv: workspace/fold/v1/folds.csv
  external_index: workspace/expA00_seg_aux_baseline/src/external_index.csv
  use_evc: false
  use_edd2020: false
  image_size: 384
  gc_prescale: 512
  batch_size: 24
  num_workers: 8
  target_pos_ratio: 0.25
  external_fraction: 0.15
model:
  encoder_name: tu-tf_efficientnetv2_s
  encoder_weights: imagenet
  seg_channels: 2
  dropout: 0.3
  pooling: avg
loss:
  seg_weight: 0.0
  pos_weight: null
optimizer:
  lr: 0.0001
  weight_decay: 0.01
  eta_min: 1.0e-06
trainer:
  max_epochs: 30
  precision: 16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 20
eval:
  val_bootstrap_iter: 200
  monitor: val/auroc
  monitor_mode: max
